# Exclude standard generated and environment directories
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    "node_modules",
    "__pycache__",
]

# Set the maximum line length
line-length = 88
indent-width = 4

# Define the min Python version we are planing to use for the project
target-version = "py310"

[lint]
# Enable specific rule categories
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/variables)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (forces modern Python syntax)
    "B",   # flake8-bugbear (finds common bugs)
]
ignore = []

# Allow Ruff to automatically fix all enabled rules
fixable = ["ALL"]
unfixable = []

[format]
# Strict formatting standards
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"